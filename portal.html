<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kilo Buster Cloud</title>
<link rel="stylesheet" href="theme.css"><script defer src="theme.js"></script>
<style>
:root{--portal-art:url('/portal/art.png')}
:root{color-scheme:dark;font:16px/1.5 Inter,"Segoe UI",system-ui,sans-serif;color:#ebeff7;background:#0b0e15}
*{box-sizing:border-box}body{margin:0}main,header{max-width:1000px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #303a48;gap:12px;flex-wrap:wrap}header strong{font-size:20px}nav,.actions,.metrics{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
a{color:#b9f477}h1{letter-spacing:-.04em;margin:.4em 0;font-size:clamp(28px,5vw,44px)}h2{font-size:19px;margin:0 0 12px}p,small,label{color:#b9c5d5}.panel{margin:16px 0;background:#151c27;border:1px solid #303a48;border-radius:14px;padding:20px}.login{max-width:420px}.metrics{align-items:stretch}.metric{flex:1 1 140px}.metric strong{display:block;font-size:24px}input,button{font:inherit;border-radius:7px;padding:8px 12px}input{width:100%;background:#0b111a;color:inherit;border:1px solid #536070}label{display:block;margin-bottom:12px}button{border:0;background:#b9f477;color:#142005;font-weight:650;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#293647;color:#eaf1fa}code{overflow-wrap:anywhere}#message{color:#ffe3a4}.row{border-top:1px solid #364252;padding:14px 0}.row input{width:7em}.row label{margin:0}.secret{font-family:monospace}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #83bbff}
body{min-height:100svh;background:#111821;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(90deg,#0b1119f5,#101925d6 54%,#111a2570),var(--portal-art) center/cover no-repeat}
header{max-width:none;padding:14px max(24px,calc((100vw - 1120px)/2));background:#101620ed;border-color:#8995aa3b}
header strong{letter-spacing:-.035em}header strong span{font-weight:450;color:#afc7d4}
main{max-width:1168px}.panel{background:#111a25f7;border-color:#566376;border-radius:12px}
a{color:#ffbf8c}button{background:#ffc08b;color:#28180b}button:hover{filter:brightness(1.08)}
body.auth::before{background:linear-gradient(90deg,#101620 4%,#101620fa 28%,#101620bc 42%,transparent 67%),var(--portal-art) right center/min(81vw,1750px) auto no-repeat,#101620}
.auth main{padding-top:clamp(44px,10vh,112px)}.auth h1{font-size:clamp(32px,4vw,48px)}
.login{max-width:370px;padding:24px;box-shadow:0 16px 44px #0005}.login input{margin-top:5px}.login button{width:100%;margin-top:6px}.login p{margin:15px 0 0}
@media(max-width:700px){body.auth::before{position:absolute;height:clamp(165px,55vw,350px);top:58px;background:linear-gradient(0deg,#111821,transparent 37%),var(--portal-art) center/cover no-repeat}.auth main{padding:clamp(145px,49vw,305px) 18px 24px}.auth .login{max-width:none}.auth h1{margin:.3em 0}.panel{padding:16px}.actions{align-items:end}header{padding:14px 18px}}
:root,body{background:var(--bg);color:var(--text)}
body::before{background-image:linear-gradient(90deg,color-mix(in srgb,var(--bg) 98%,transparent),color-mix(in srgb,var(--bg) 84%,transparent)),var(--portal-art)}
body.auth::before{background-color:var(--bg);background-image:linear-gradient(90deg,var(--bg) 4%,var(--bg) 28%,color-mix(in srgb,var(--bg) 75%,transparent) 42%,transparent 67%),var(--portal-art)}
header,.panel{background:var(--surface);border-color:var(--border)}header strong span,p,small,label{color:var(--muted)}
nav{margin-left:auto}button{background:var(--accent);color:#13200b}button:hover{background:var(--accent-strong)}
button.secondary{background:var(--secondary);color:var(--text)}input{background:var(--field);color:var(--text);border-color:var(--border)}
a,#message{color:var(--accent)}:root[data-theme="light"] a,:root[data-theme="light"] #message{color:color-mix(in srgb,var(--accent) 42%,#101720)}
.row{border-color:var(--border)}.key-line{padding:10px;border-radius:8px;margin:8px 0;background:var(--surface-2)}.key-line strong{min-width:8em}.appearance-menu label{margin:0}.key-reveal{border:2px solid var(--accent);box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 18%,transparent)}.key-reveal .secret{font-size:clamp(12px,1.5vw,15px);letter-spacing:.02em}.key-reveal p{margin-top:0}
@media(max-width:700px){body.auth::before{background-image:linear-gradient(0deg,var(--bg),transparent 37%),var(--portal-art)}header{position:relative;z-index:1}.appearance-menu{background:var(--surface)}}
</style></head><body><header><strong>Kilo Buster <span>Cloud</span></strong><nav id="nav"></nav></header><main>
<h1 id="title"></h1><p id="message" role="status"></p><div id="content"></div>
<style>dialog.panel{margin:auto;color:var(--text);width:min(420px,94vw)}dialog::backdrop{background:#060910ac}dialog select{display:block;width:100%;font:inherit;padding:8px;border-radius:7px;background:var(--field);color:var(--text);border:1px solid var(--border)}</style>
<dialog id="upgrade" aria-labelledby="upgrade-title" class="panel"><form id="upgradeForm">
<h2 id="upgrade-title">Need more usage?</h2><p>Send your request to aaronwise@aaronwiseai.com.</p>
<label for="requestedRate">Requests per hour</label><select id="requestedRate"><option value="2500">2,500</option><option value="5000">5,000</option><option value="10000">10,000</option><option value="25000">25,000</option></select>
<label>Your contact email<input id="contactEmail" type="email" autocomplete="email" maxlength="254" required></label>
<p role="status" id="mailStatus"></p><div class="actions"><button type="submit">Send request</button><button type="button" class="secondary" id="cancelRequest">Cancel</button></div>
</form></dialog>
<section id="issued" class="panel key-reveal" hidden><h2>API key created</h2><p id="issuedMeta">Copy this key now. The full value is only available at creation time.</p><label>Full API key<input class="secret" id="secret" readonly></label><button id="copy">Copy key</button></section>
</main><script>
const $=id=>document.getElementById(id), path=location.pathname;
if(location.protocol==='file:') document.documentElement.style.setProperty('--portal-art','url("./assets/Kilo Buster_ Breaking Network Chains.png")');
const content=$('content'), nav=$('nav');
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function link(parent,label,href){const n=el('a',label);n.href=href;parent.append(n)}
function message(text){$('message').textContent=text}
$('cancelRequest').onclick=()=>$('upgrade').close();
$('upgradeForm').onsubmit=async e=>{
  e.preventDefault();const submit=e.submitter;submit.disabled=true;$('mailStatus').textContent='Sending…';
  try{await api('/portal/usage-request',{rate:Number($('requestedRate').value),email:$('contactEmail').value.trim()});
    $('upgrade').close();message('Your usage request was submitted. We can reply to your contact email.');
  }catch(err){$('mailStatus').textContent=err.message}finally{submit.disabled=false}
};
async function api(path,data){
  const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const result=await r.json(); if(!r.ok)throw Error(result.error?.message || 'Request failed.');return result;
}
function button(parent,label,work,secondary=false){
  const b=el('button',label,secondary?'secondary':'');b.type='button';
  b.onclick=async()=>{b.disabled=true;message('');try{await work()}catch(e){message(e.message)}finally{b.disabled=false}};
  parent.append(b);return b;
}
function field(parent,name,type,autocomplete){
  const label=el('label',name), input=el('input');input.type=type;input.required=true;
  if(autocomplete)input.autocomplete=autocomplete;
  label.append(input);parent.append(label);return input;
}
function showKey(key,meta='Copy this key now. The full value is only available at creation time.'){$('secret').value=key;$('issuedMeta').textContent=meta;$('issued').hidden=false;$('issued').scrollIntoView({block:'nearest'});}
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('secret').value);message('Key copied.')}catch{$('secret').select();message('Press Ctrl+C or Command+C to copy.')}};
function signOut(){button(nav,'Sign out',async()=>{await api('/portal/logout',{});location.replace('/login')},true)}
function auth(){
  document.body.classList.add('auth');
  const admin=path==='/admin', register=path==='/register';
  $('title').textContent=admin?'Administrator sign-in':register?'Create an account':'Sign in';
  link(nav,admin?'User sign-in':'Administrator',admin?'/login':'/admin'); link(nav,'Setup guide','/setup');
  const form=el('form',undefined,'panel login');content.append(form);
  const user=admin?null:field(form,'Username','text','username');
  if(user){user.pattern='[a-zA-Z0-9_-]{3,32}';user.title='3–32 letters, numbers, underscores or hyphens';}
  const pass=field(form,register?'Password (at least 10 characters)':'Password','password',register?'new-password':'current-password');
  if(register)pass.minLength=10;
  const submit=el('button',register?'Create account':'Sign in');form.append(submit);
  if(!admin){const p=el('p');link(p,register?'Already registered? Sign in':'Create an account','/'+(register?'login':'register'));form.append(p)}
  form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{
    const r=await api('/portal/'+(admin?'admin':register?'register':'login'),{username:user?.value,password:pass.value});
    location.replace(r.location);
  }catch(err){message(err.message)}finally{submit.disabled=false}};
}
function metrics(parent,values){
  const block=el('div',undefined,'metrics');parent.append(block);
  for(const [label,value] of values){const card=el('div',undefined,'metric panel');card.append(el('small',label),el('strong',Number(value).toLocaleString()));block.append(card)}
}
function guide(){
  $('title').textContent='Setup guide'; link(nav,'Sign in','/login'); link(nav,'Create account','/register');
  const p=el('section',undefined,'panel');content.append(p);p.append(el('h2','Connect any OpenAI-compatible tool'),el('p','Set the base URL to the endpoint below, use your assigned API key, and select the model kilo-auto/free.'),el('h3','Endpoint URL'),el('code',location.origin+'/v1'),el('h3','Model'),el('code','kilo-auto/free'));
  const trial=el('section',undefined,'panel');content.append(trial);const renderTrial=r=>{trial.replaceChildren(el('h2','Try the service'),el('p','Your private trial key is limited to 750 requests per hour and expires after 3 days.'));const input=el('input');input.value=r.key;input.readOnly=true;input.className='secret';trial.append(el('p','Trial endpoint: '+r.endpoint),input);localStorage.setItem('kb_trial_key',r.key);message('Your current trial key is shown below. Keep it private.')};trial.append(el('h2','Try the service'),el('p','Get one private trial key for this browser. It is limited to 750 requests per hour and expires after 3 days.'),button(trial,'Get trial key',async()=>renderTrial(await api('/portal/trial',{}))));if(localStorage.getItem('kb_trial_key')){const input=el('input');input.value=localStorage.getItem('kb_trial_key');input.readOnly=true;input.className='secret';trial.append(el('p','Your current trial key'),input)}
  const steps=el('section',undefined,'panel');content.append(steps);steps.append(el('h2','Quick-start examples'));
  const examples=[['OpenAI SDK (JavaScript)',`import OpenAI from 'openai';\nconst client = new OpenAI({ baseURL: '${location.origin}/v1', apiKey: process.env.KILO_BUSTER_API_KEY });\nconst result = await client.chat.completions.create({ model: 'kilo-auto/free', messages: [{ role: 'user', content: 'Hello' }] });`],['OpenAI SDK (Python)',`from openai import OpenAI\nclient = OpenAI(base_url='${location.origin}/v1', api_key=os.environ['KILO_BUSTER_API_KEY'])\nprint(client.chat.completions.create(model='kilo-auto/free', messages=[{'role':'user','content':'Hello'}]))`],['curl',`curl ${location.origin}/v1/chat/completions \\\n  -H "Authorization: Bearer $KILO_BUSTER_API_KEY" \\\n  -H "Content-Type: application/json" \\\n  -d '{"model":"kilo-auto/free","messages":[{"role":"user","content":"Hello"}]}'`]];
  for(const [name,code] of examples){const block=el('div',undefined,'row');block.append(el('strong',name));const pre=el('pre');pre.textContent=code;block.append(pre);button(block,'Copy example',async()=>{await navigator.clipboard.writeText(code);message('Example copied.')},true);steps.append(block)}
  steps.append(el('p','Compatible with OpenClaw, DeepSeek Harness, OpenCode, Kilo Code, Claude Code, and other OpenAI-compatible tools. Keep your API key private.'));
}
async function account(){
  const u=await api('/portal/me');content.replaceChildren();$('title').textContent=u.username;if(new URLSearchParams(location.search).get('billing')==='success')message('Payment confirmed. Your plan and API quota are active.');
  metrics(content,[['Requests left this hour',u.remaining],['Used in last 60 min',u.used],['Hourly limit',u.quota],['Lifetime requests',u.total]]);
  const p=el('section',undefined,'panel');content.append(p);p.append(el('h2','API access'),el('code',location.origin+'/v1'),
    el('p',u.keys.length?'Assigned keys':'Your administrator can assign you an API key.'));
  for(const k of u.keys){const line=el('div',undefined,'key-line');line.append(el('strong','API key · '+k.suffix),el('p',k.remaining+' of '+k.quota+' requests left this hour'));const copy=el('button','Copy API key','secondary');copy.type='button';copy.onclick=async()=>{try{await navigator.clipboard.writeText(k.key);message('API key copied to clipboard.')}catch{message('Clipboard access was blocked.')}};line.append(copy);p.append(line)}
  const plans=el('div',undefined,'actions'); for(const [rate,price] of [[2500,'$7.99/mo'],[5000,'$12.99/mo'],[7500,'$19.99/mo'],[10000,'$29.99/mo']]) button(plans,'Upgrade to '+rate.toLocaleString()+'/hr · '+price,async()=>{const r=await api('/portal/checkout',{price:rate});location.href=r.url},true); p.append(plans);
  button(p,'Need more usage?',()=>{$('mailStatus').textContent='';$('upgrade').showModal()});
  metrics(content,[['Lifetime input tokens',u.input],['Lifetime output tokens',u.output],['Total tokens',u.input+u.output]]);
}
async function admins(){
  const [users,v,payments,sales]=await Promise.all([api('/portal/users'),api('/admin/allocation'),api('/portal/payments'),api('/portal/sales')]); content.replaceChildren();
  metrics(content,[['Available proxies',v.active],['Hourly capacity',v.capacity],['Assigned per hour',v.assigned],[v.balance<0?'Overassigned per hour':'Unassigned per hour',Math.abs(v.balance)]]);
  content.append(el('p',v.active+' available proxies × '+v.perProxy+' attempts/hour. '+v.remainingNow+' attempts remain right now. Assignments may exceed capacity.'));
  const payPanel=el('section',undefined,'panel');payPanel.append(el('h2','Payments'));content.append(payPanel);if(!payments.length)payPanel.append(el('p','No payments received yet.'));for(const p of payments){const row=el('div',undefined,'row');row.append(el('strong',(p.username||'Unknown user')+' · '+p.quota.toLocaleString()+'/hr'),el('p',p.status+' · '+new Date(p.created).toLocaleString()));if(p.status==='pending')button(row,'Approve payment',async()=>{await api('/portal/payments/'+p.id+'/approve',{});await admins();message('Payment approved and quota activated.')});payPanel.append(row)}
  const salesPanel=el('section',undefined,'panel');salesPanel.append(el('h2','Sales analytics'));const salesGrid=el('div',undefined,'metrics');for(const [label,data] of [['Today',sales.today],['This week',sales.week],['This month',sales.month],['Lifetime',sales.total]]){const card=el('div',undefined,'metric');card.append(el('small',label),el('strong','$'+(data.cents/100).toFixed(2)),el('p',data.count+' approved payment'+(data.count===1?'':'s')));salesGrid.append(card)}salesPanel.append(salesGrid);const customers=el('div');customers.append(el('h3','Customers'));for(const c of sales.customers){const row=el('div',undefined,'row');row.append(el('strong',c.username),el('p','Joined '+new Date(c.joined).toLocaleDateString()+' · '+c.renewals+' payment'+(c.renewals===1?'':'s')+' · $'+(c.cents/100).toFixed(2)));customers.append(row)}salesPanel.append(customers);content.append(salesPanel);
  const create=el('form',undefined,'panel'), fields=el('div',undefined,'actions');
  create.append(el('h2','Create account and key'),fields);content.append(create);
  const username=field(fields,'New username','text','off'), password=field(fields,'User password','password','new-password');
  username.pattern='[A-Za-z0-9_\\-]{3,32}';password.minLength=10;password.maxLength=256;
  const quota=limitInput(fields,'Hourly request limit',v.defaultLimit), submit=el('button','Create account and key');
  fields.append(submit);
  create.onsubmit=async event=>{event.preventDefault();submit.disabled=true;
    try{const result=await api('/portal/users/create-with-key',{username:username.value,password:password.value,quota:quota.valueAsNumber});
      const name=username.value;create.reset();await admins();showKey(result.key,'Account '+name+' created. Copy this full key now and store it securely; it cannot be recovered later.');message('Account and key created for '+name+'.');
    }catch(e){message(e.message)}finally{submit.disabled=false}
  };
  const panel=el('section',undefined,'panel');panel.append(el('h2','API key management'));content.append(panel);
  if(!users.length)panel.append(el('p','Registered users will appear here.'));
  for(const u of users){
    const row=el('div',undefined,'row'),actions=el('div',undefined,'actions');panel.append(row);
    row.append(el('strong',u.username+(u.trial_until?' · Trial':'')+(u.disabled?' · Revoked':'')),el('p',u.used+' used this hour · '+u.remaining+' left · '+u.total+' lifetime requests'),actions);
    const base='/portal/users/'+u.id+'/';
    if(!u.disabled){
      const limit=limitInput(actions,'New key limit / hour',v.defaultLimit);
      button(actions,'Create key',async()=>{if(!limit.reportValidity())return;
        const result=await api(base+'key',{quota:limit.valueAsNumber});await admins();showKey(result.key,'A new key for '+u.username+' was created. Copy this full key now and store it securely; it cannot be recovered later.');
      });
    }
    for(const k of u.keys){
      const line=el('div',undefined,'actions key-line');row.append(line);
      line.append(el('strong','•••• '+k.suffix),el('small',k.used+' used · '+k.remaining+' left'));
      const limit=limitInput(line,'Hourly limit',k.quota), endpoint='/portal/keys/'+k.id+'/';
      button(line,'Save limit',async()=>{if(!limit.reportValidity())return;await api(endpoint+'quota',{quota:limit.valueAsNumber});await admins();message('Limit saved.')},true);
      button(line,'Delete key',async()=>{if(!confirm('Delete the key ending in '+k.suffix+' for '+u.username+'?'))return;
        await api(endpoint+'delete',{});$('issued').hidden=true;$('secret').value='';await admins();message('Key deleted.');
      },true);
    }
    button(actions,u.disabled?'Restore access':'Revoke access',async()=>{
      if(!u.disabled&&!confirm('Revoke all access for '+u.username+'?'))return;
      await api(base+(u.disabled?'enable':'revoke'),{});$('issued').hidden=true;$('secret').value='';await admins();
    },true);
  }
}
function limitInput(parent,label,value){const input=field(parent,label,'number');input.min=0;input.max=1000000;input.value=value;return input}
if(path==='/setup')guide();
else if(path==='/account'){signOut();account().catch(e=>message(e.message));setInterval(()=>{if(!document.hidden&&!$('upgrade').open)account().catch(e=>message(e.message))},15000)}
else if(path==='/admin/users'){$('title').textContent='Accounts and allocation';link(nav,'Proxy dashboard','/dashboard');signOut();admins().catch(e=>message(e.message));button(nav,'Refresh',admins,true)}
else auth();
</script></body></html>
